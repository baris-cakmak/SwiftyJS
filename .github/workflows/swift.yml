name: Swift

on:
  push:
    branches: ["main", "codex/swiftsyntax-602"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Macro and JavaScript runtime tests
        run: swift test
